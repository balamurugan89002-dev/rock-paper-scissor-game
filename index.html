<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Rock Paper Scissors game"
    >

    <title>You VS Computer</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>


    <!-- =========================
         START SCREEN
    ========================== -->

    <div id="start-screen">

        <div class="logo">
            🎮
        </div>

        <h1>
            YOU VS COMPUTER
        </h1>

        <p>
            ROCK • PAPER • SCISSORS
        </p>

        <p class="target">
            FIRST TO 10 POINTS WINS
        </p>

        <button
            id="start-button"
            onclick="startGame()"
        >
            START GAME
        </button>

    </div>



    <!-- =========================
         GAME SCREEN
    ========================== -->

    <div id="game-screen">

        <h1>
            YOU VS COMPUTER
        </h1>


        <!-- =========================
             PLAYER VS COMPUTER
        ========================== -->

        <div class="battle">


            <!-- PLAYER -->

            <div class="player">

                <h3>
                    YOU
                </h3>

                <div id="player-icon">
                    ❔
                </div>

                <p id="player-choice">
                    -
                </p>

            </div>


            <!-- COLON -->

            <div class="colon">
                :
            </div>


            <!-- COMPUTER -->

            <div class="player">

                <h3>
                    COMPUTER
                </h3>

                <div id="computer-icon">
                    ❔
                </div>

                <p id="computer-choice">
                    -
                </p>

            </div>

        </div>



        <!-- =========================
             CHOICE SECTION
        ========================== -->

        <div class="choice-section">

            <h2>
                Choose Your Move
            </h2>


            <div class="choices">

                <button
                    onclick="play('rock')"
                >
                    🪨 Rock
                </button>


                <button
                    onclick="play('paper')"
                >
                    📄 Paper
                </button>


                <button
                    onclick="play('scissors')"
                >
                    ✂️ Scissor
                </button>

            </div>

        </div>



        <!-- =========================
             RESULT
        ========================== -->

        <p id="result">
            Choose your move! 🎮
        </p>



        <!-- =========================
             SCORE
        ========================== -->

        <div class="score">

            <span id="player-score">
                0
            </span>

            <span>
                :
            </span>

            <span id="computer-score">
                0
            </span>

        </div>



        <!-- =========================
             FINAL WINNER
        ========================== -->

        <p id="final-winner">
        </p>



        <!-- =========================
             TRY AGAIN / NEW GAME
        ========================== -->

        <button
            id="try-again"
            onclick="resetGame()"
        >
            🔄 TRY AGAIN
        </button>

    </div>



    <!-- =========================
         PYODIDE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js">
    </script>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="./script.js">
    </script>


</body>

</html>
